name: Browser tests

# Installs an Exponential Platform DXP project (se7enxweb skeleton, SQLite)
# with this package from the checkout and checks the front page and the
# admin login in Chromium.

on:
    push:
        branches:
            - main
            - '[0-9]+.[0-9]+'
    pull_request: ~
    workflow_dispatch: ~

permissions:
    contents: read

jobs:
    core-behat:
        name: "Kernel browser tests"
        uses: se7enxweb/gh-workflows/.github/workflows/browser-tests.yml@main
        with:
            project-edition: 'oss'
        secrets: inherit
